<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHALLENGE TERMINAL</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin:0; padding:0; overflow:hidden; font-family: 'VT323', monospace; }
    .main-container {
      display: flex;
      height: 100vh;
      background: #0a0a0a;
      color: #00ff41;
    }
    .left-panel { flex: 2; padding: 30px; overflow-y: auto; border-right: 3px solid #00ff41; }
    .right-panel { flex: 1.1; padding: 25px; background: #0a0a0a; display: flex; flex-direction: column; }

    .question { background: #111; border: 3px solid #00ff41; padding: 30px; border-radius: 8px; font-size: 1.75rem; }
    .options button { display: block; width: 100%; margin: 15px 0; padding: 18px; font-size: 1.5rem; text-align: left; }

    .timer { font-size: 3.2rem; color: #ff0044; text-shadow: 0 0 20px #ff0044; }
    .team-name { font-size: 2.1rem; color: #00ff9d; }

    .q-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 15px 0;
    }
    .q-btn {
      padding: 14px 8px;
      font-size: 1.45rem;
      background: #111;
      border: 2px solid #00ff41;
      color: #00ff41;
      cursor: pointer;
    }
    .q-btn.attempted { background: #003300; border-color: #00ff00; color: #00ff00; cursor: default; }
    .q-btn.skipped { background: #442200; border-color: #ffaa00; color: #ffaa00; }
    .q-btn:hover:not(.attempted):not(.skipped) { background: #00ff41; color: black; }

    /* Big Start Button */
    #startBtn {
      font-size: 2.5rem;
      padding: 30px 60px;
      background: #00ff41;
      color: black;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 40px #00ff41;
    }
    #startBtn:hover {
      background: #ffff00;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="startScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0a0a; display:flex; align-items:center; justify-content:center; z-index:100;">
    <div style="text-align:center;">
      <h1 style="font-size:4rem; margin-bottom:30px;">READY FOR CHALLENGE?</h1>
      <button id="startBtn" onclick="startChallenge()">ENTER FULLSCREEN & START</button>
      <p style="margin-top:40px; color:#ff8800; font-size:1.6rem;">Click the button to begin • Fullscreen will activate</p>
    </div>
  </div>

  <div class="main-container" id="mainContent" style="display:none;">
    <!-- Left Panel -->
    <div class="left-panel">
      <h1 style="text-align:center; margin-bottom:25px; font-size:2.8rem;">CYBER CHALLENGE</h1>
      <div id="questionContainer"></div>

      <div style="text-align:center; margin-top:40px;">
        <button onclick="skipQuestion()" style="padding:16px 45px; font-size:1.6rem;">SKIP (0 PTS)</button>
        <button onclick="finishQuiz()" style="background:#00aa00; color:black; padding:16px 45px; font-size:1.6rem; margin-left:20px;">SUBMIT QUIZ</button>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div style="text-align:center;">
        <div class="team-name">TEAM: <strong id="teamName"></strong></div>
        <div class="timer" id="timer">45:00</div>
      </div>

      <h3 style="margin:25px 0 10px 0; text-align:center;">QUESTION NAVIGATION</h3>
      <div class="q-list" id="questionList"></div>

      <div style="margin-top:auto; text-align:center; font-size:1.7rem;">
        Score: <strong id="currentScore" style="color:#ffff00;">0</strong>
      </div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script>
    let currentTeam = localStorage.getItem('currentTeam') || "TEAM01";
    let currentQ = 0;
    let score = parseInt(localStorage.getItem(`score_${currentTeam}`)) || 0;
    let answers = JSON.parse(localStorage.getItem(`answers_${currentTeam}`)) || {};
    let timeLeft = 45 * 60;
    let timerInterval;

    document.getElementById('teamName').textContent = currentTeam;

    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    }

    function startChallenge() {
      // Hide start screen and show main content
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'flex';

      enterFullscreen();        // This will work because it's triggered by click
      loadQuestion();
      startTimer();
      renderQuestionList();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;

        if (timeLeft <= 300) document.getElementById('timer').style.color = "#ff8800";

        if (timeLeft <= 0) finishQuiz(true);
      }, 1000);
    }

    function loadQuestion() {
      const q = questions[currentQ];
      let html = `<div class="question"><h3>Q${q.id}. ${q.question} <span style="color:#ffff00;">(${q.points} pts)</span></h3>`;

      if (q.type === "mcq") {
        html += `<div class="options">`;
        q.options.forEach((opt, i) => {
          html += `<button onclick="selectAnswer(${q.id}, ${i})">${opt}</button>`;
        });
        html += `</div>`;
      } else {
        html += `
          <input type="text" id="fillAnswer" placeholder="Type your answer here..." style="width:100%; padding:18px; font-size:1.6rem; margin-top:15px;">
          <button onclick="submitFill(${q.id})" style="margin-top:15px; padding:12px 30px;">Submit Answer</button>
        `;
      }
      html += `</div>`;
      document.getElementById('questionContainer').innerHTML = html;
      updateScore();
      renderQuestionList();
    }

    function selectAnswer(qid, selected) {
      const q = questions.find(qq => qq.id === qid);
      answers[qid] = selected;
      if (selected === q.correct) score += q.points;
      else score -= 50;
      updateScore();
      renderQuestionList();
      goToNextUnanswered();
    }

    function submitFill(qid) {
      const ans = document.getElementById('fillAnswer').value.trim().toLowerCase();
      if (!ans) return alert("Please type an answer");
      const q = questions.find(qq => qq.id === qid);
      answers[qid] = ans;
      if (ans === String(q.correct).toLowerCase()) score += q.points;
      else score -= 50;
      updateScore();
      renderQuestionList();
      goToNextUnanswered();
    }

    function updateScore() {
      document.getElementById('currentScore').textContent = score;
      localStorage.setItem(`score_${currentTeam}`, score);
      localStorage.setItem(`answers_${currentTeam}`, JSON.stringify(answers));
    }

    function goToNextUnanswered() {
      for (let i = 0; i < questions.length; i++) {
        if (!answers.hasOwnProperty(questions[i].id) || answers[questions[i].id] === "skipped") {
          currentQ = i;
          loadQuestion();
          return;
        }
      }
    }

    function skipQuestion() {
      answers[questions[currentQ].id] = "skipped";
      renderQuestionList();
      goToNextUnanswered();
    }

    function renderQuestionList() {
      const container = document.getElementById('questionList');
      container.innerHTML = '';
      questions.forEach((q, idx) => {
        const status = answers[q.id];
        let cls = '';
        if (status === "skipped") cls = 'skipped';
        else if (status !== undefined) cls = 'attempted';

        const btn = document.createElement('button');
        btn.className = `q-btn ${cls}`;
        btn.textContent = q.id;
        if (!cls || cls === 'skipped') {
          btn.onclick = () => { currentQ = idx; loadQuestion(); };
        }
        container.appendChild(btn);
      });
    }

    function finishQuiz(auto = false) {
      clearInterval(timerInterval);
      if (document.fullscreenElement) document.exitFullscreen();
      const msg = auto ? "TIME UP!\n\n" : "";
      if (confirm(msg + "Submit the quiz now?")) {
        alert(`CHALLENGE COMPLETE!\n\nTeam: ${currentTeam}\nFinal Score: ${score} points`);
        window.location.href = 'index.html';
      }
    }

    // Optional: Warn if user tries to exit fullscreen
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && document.getElementById('mainContent').style.display !== 'none') {
        alert("Warning: Exiting fullscreen may be considered cheating!");
      }
    });
  </script>
</body>
</html>
